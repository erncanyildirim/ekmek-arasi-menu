<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menü</title>
<style>
:root{--bg:#FBF7F1;--ink:#1F2328;--gold:#9A7B4F;--card:#FFFFFF;--line:#EADFCB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Avenir Next",Arial,sans-serif}
header{text-align:center;padding:32px 16px 20px}
header h1{font-family:Didot,"Bodoni 72","Times New Roman",serif;font-weight:400;font-size:42px;margin:0;letter-spacing:1px}
header p{margin:6px 0 0;color:var(--gold);letter-spacing:4px;font-size:13px;text-transform:uppercase}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;justify-content:center}
nav a{white-space:nowrap;border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:999px;text-decoration:none;font-size:14px}
main{max-width:640px;margin:0 auto;padding:0 16px 40px}
h2{font-size:18px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:28px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.item img{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:none;background:#EEE}
.item .txt{flex:1;min-width:0}
.item h3{margin:0 0 4px;font-size:17px}
.item p{margin:0;color:#6B6258;font-size:14px;line-height:1.4}
.price{font-weight:700;margin-top:6px;white-space:nowrap}
.empty{text-align:center;color:#8A8078;padding:40px 0}
footer{text-align:center;color:#8A8078;font-size:13px;padding:24px 16px 40px}
footer a{color:var(--gold)}
</style>
</head>
<body>
<header><h1 id="bname">Menü</h1><p id="tag"></p></header>
<nav id="cats"></nav>
<main id="menu"><div class="empty">Menü yakında eklenecek.</div></main>
<footer id="foot"></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('data/menu.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const b=d.business||{};
  document.title=(b.name||'Menü')+' — Menü';
  document.getElementById('bname').textContent=b.name||'Menü';
  document.getElementById('tag').textContent=b.tagline||'';
  const f=[b.address,b.phone?'Tel: '+b.phone:'',b.instagram?'Instagram: '+b.instagram:''].filter(Boolean);
  document.getElementById('foot').innerHTML=f.map(esc).join('<br>');
  const prods=(d.products||[]).filter(p=>p.active!==false);
  if(!prods.length) return;
  const cats=d.categories&&d.categories.length?d.categories:[...new Set(prods.map(p=>p.category||'Diğer'))];
  document.getElementById('cats').innerHTML=cats.map(c=>`<a href="#c-${esc(c).replace(/\s/g,'-')}">${esc(c)}</a>`).join('');
  document.getElementById('menu').innerHTML=cats.map(c=>{
    const items=prods.filter(p=>(p.category||'Diğer')===c);
    if(!items.length) return '';
    return `<h2 id="c-${esc(c).replace(/\s/g,'-')}">${esc(c)}</h2>`+items.map(p=>`
      <div class="item">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:''}
      <div class="txt"><h3>${esc(p.name)}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}
      <div class="price">${esc(p.price)}</div></div></div>`).join('');
  }).join('');
}).catch(()=>{});
</script>
</body>
</html>
